 else if(id==='pub')publish();
 else if(id==='send')sendMsg();
 else if(id==='theme'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'}
 else if(id==='go')doAuth();
 else if(id==='sw'){S.mode=S.mode==='up'?'in':'up';authView()}
 else if(id==='savep')saveProfile();
 else if(id==='cancel'){S.edit=false;view()}
 else if(id==='retry')view();
 else if(id==='logout')sb.auth.signOut();
});
document.addEventListener('input',e=>{const i=e.target;
 if(i.id==='q'){S.q=i.value.trim();clearTimeout(qt);const v=S.q;qt=setTimeout(()=>searchUsers(v,$('#gr'),'user',()=>grid(S.exl)),250)}
 else if(i.id==='dq'){clearTimeout(qt);const v=i.value.trim();qt=setTimeout(()=>searchUsers(v,$('#dl'),'chat',()=>S.convHTML),250)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
 if(t.matches('.cin input'))t.nextElementSibling.click();else if(t.matches('.authbox input')){const g=$('#go')||$('#savep');g&&g.click()}});
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 if(e.target.id==='file'){const c=$('#cap');c&&(S.draft.cap=c.value);
  if(f.type.startsWith('video/')){
   if(S.draft.kind==='story')return toast('ویدیو فقط برای پست قابل انتشاره');
   if(!['video/mp4','video/webm'].includes(f.type))return toast('فقط ویدیوی MP4 یا WebM پشتیبانی می‌شه');
   if(f.size>30*1048576)return toast('حجم ویدیو باید کمتر از ۳۰ مگابایت باشه');
   vidMeta(f).then(m=>{if(m.d>90){URL.revokeObjectURL(m.u);return toast('ویدیو باید کوتاه‌تر از ۹۰ ثانیه باشه')}Object.assign(S.draft,{vfile:f,vprev:m.u,blob:null,prev:null});newView()},()=>toast('ویدیو خونده نشد'))}
  else shrink(f,1080,(b,p)=>{Object.assign(S.draft,{blob:b,prev:p,vfile:null,vprev:null});newView()})}
 else if(e.target.id==='afile'){S.au.n=$('#e_n').value;S.au.bio=$('#e_b').value;shrink(f,320,(b,p)=>{S.au.blob=b;S.au.prev=p;editView()})}});
if(!sb)view();else{
 sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{if(s&&s.user)boot(s.user);else if(ME){ME=null;S.following=new Set();S.tab='home';view()}},0)});
 sb.auth.getSession().then(({data})=>{if(!data.session)view()});
}
</script>
</body>
</html>
